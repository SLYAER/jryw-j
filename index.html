<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1fb;--fg:#161a2b;--card:rgba(255,255,255,.8);--bd:rgba(30,40,90,.12);--ac:#4f46e5;--ac2:#06b6d4;--mut:#5d647c;--ok:#0f9d58;--sh:0 8px 24px rgba(40,50,120,.12)}

*{box-sizing:border-box}

.w{max-width:1120px;margin:0 auto;padding:14px;animation:in .4s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.hero{max-width:360px;margin:12vh auto;text-align:center}.hero .big{font-size:56px}.hero input{margin-bottom:10px;text-align:center}.hero button{width:100%;padding:11px}

.w{max-width:none;padding:0}
body:after{content:"";position:fixed;width:420px;height:420px;border-radius:50%;background:var(--ac2);filter:blur(120px);opacity:.14;right:-100px;bottom:-100px;animation:fl 12s ease-in-out infinite alternate;pointer-events:none;z-index:-1}@keyframes fl{to{transform:translate(-140px,-90px)}}
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:3px;background:var(--card);border-right:1px solid var(--bd);backdrop-filter:blur(18px)}
.logo{display:flex;gap:10px;align-items:center;font-size:30px;margin-bottom:10px}.logo b{font-size:16px;display:block;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}.logo small,.who small{display:block;font-size:11px;color:var(--mut);font-size:11px}
.who{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;border:1px solid var(--bd);margin-bottom:6px}.who b{font-size:14px}.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:12px 8px 4px}
.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:12px}.nv span{width:22px;text-align:center}.nv em{margin-left:auto;font-style:normal;font-size:11px;opacity:.7}.nv.sm{padding:7px 12px;font-size:14px}
.nv:hover{background:color-mix(in srgb,var(--ac) 14%,transparent);transform:none}
.nv.on,.nv.on:hover{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 40%,transparent)}
.sp{flex:1;min-height:12px}.side .stt{align-self:flex-start;margin:6px 8px}
.main{padding:20px;min-width:0}.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.top h1{font-size:28px;margin-right:auto}.mb,.ov{display:none}
.ph{display:none}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat{position:relative;overflow:hidden;padding:16px;border-radius:18px;border:1px solid var(--bd);background:var(--card);box-shadow:var(--sh);transition:.2s;animation:in .4s ease}.stat:hover{transform:translateY(-4px)}
.stat:after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));opacity:.18}
.si{font-size:22px}.sn{font-size:26px;font-weight:800;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}.sl{color:var(--mut);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.li{padding:7px 0;border-bottom:1px solid var(--bd);margin:0}
.bar{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;margin:9px 0;font-size:13px}.bar i{height:10px;border-radius:999px;background:var(--bd);overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:999px;transition:width .6s}.bar em{font-style:normal;text-align:right}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{position:fixed;z-index:20;left:0;top:0;bottom:0;height:auto;width:275px;transform:translateX(-105%);transition:.25s;padding-top:calc(16px + env(safe-area-inset-top,0px));background:var(--bg)}.open .side{transform:none}.mb{display:block}.open .ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:15}.two{grid-template-columns:1fr}.top h1{font-size:21px}.bar{grid-template-columns:110px 1fr 34px}.main{padding:12px}}

input,select,textarea{font-size:16px}
.bnav{display:none}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}button{touch-action:manipulation}
@media(max-width:820px){
.main{padding:12px 12px calc(88px + env(safe-area-inset-bottom,0px))}
.bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:12;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd)}
.bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;padding:6px 2px;color:var(--mut);border-radius:12px;box-shadow:none}
.bnav button span{font-size:20px;line-height:1.1}.bnav .on{color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent)}
.top .p,.mb{display:none}.top h1{font-size:20px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:11px}.m{font-size:15px;padding-right:24px}.pr{font-size:16px}.ic{font-size:20px;right:8px;top:10px}.r{flex-wrap:wrap;gap:2px}
.cats{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:96px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.f{grid-template-columns:1fr 1fr}.box{padding:12px;border-radius:14px}
.stats{grid-template-columns:1fr 1fr}.stat{padding:12px}.sn{font-size:20px}
#toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
table{min-width:0}table,tbody,tr,td{display:block}tr:first-child{display:none}
tr{border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-bottom:8px}
td{border:0;padding:3px 0}td.mp:before{content:"MRP ";color:var(--mut)}td.dp:before{content:"Dealer ";color:var(--mut)}
.sc{overflow:visible}.bar{grid-template-columns:100px 1fr 30px}
}
@media(pointer:coarse){button,.chip,.nv{min-height:40px}.chip{padding:8px 14px}td button{min-height:36px;min-width:36px}}
.os{display:flex;align-items:center;gap:6px;margin:3px 0;white-space:nowrap}.os small{min-width:78px;color:var(--mut);font-size:12px}.os b{min-width:22px;text-align:center}
.ol{font-size:12px;color:var(--mut);margin:2px 0 4px}
.top select{width:auto;max-width:46%;padding:7px 10px}
</style>

<body>
<div class="w" id="app"></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem={},ST={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
let db=null;try{db=JSON.parse(ST.get('shopdb'))}catch(e){}db=db||{products:[],users:[]};
let cloud=false,H=null,loc={products:[],users:[]},rp=[],dm={},rdy=false;
const save=()=>{if(!cloud)ST.set('shopdb',JSON.stringify(db))};
function note(m,ok){const t=$('#toast');t.textContent=m;t.style.background=ok==2?'#4f46e5':ok?'#12a150':'#e5484d';t.style.display='block';setTimeout(()=>t.style.display='none',4000)}
function refresh(){if(!me)return;const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)){if(S.tab=='cat'&&$('#res')){$('#fc').innerHTML=facets();$('#res').innerHTML=results()}}else render()}
const CATS={
'TV':{i:'📺',f:[{k:'size',l:'Screen size',u:' inch',o:['24','32','40','43','50','55','65','75']},{k:'type',l:'Type',o:['LED','Smart LED','Android','Google TV','QLED']}]},
'Washing Machine':{i:'🧺',f:[{k:'type',l:'Type',o:['Semi-Automatic','Fully Automatic']},{k:'load',l:'Load',o:['Top Load','Front Load'],when:a=>a.type=='Fully Automatic'},{k:'cap',l:'Capacity',u:' kg',o:['6','6.5','7','7.5','8','9','10']}]},
'Refrigerator':{i:'🧊',f:[{k:'doors',l:'Doors',o:['Single Door','Double Door','Triple Door','Side by Side']},{k:'cap',l:'Capacity',u:' L',o:['165','190','236','260','300','350','500']},{k:'star',l:'Rating',o:['2 Star','3 Star','4 Star','5 Star']}]},
'Air Conditioner':{i:'❄️',f:[{k:'type',l:'Type',o:['Split','Window']},{k:'ton',l:'Capacity',u:' Ton',o:['1','1.5','2']},{k:'star',l:'Rating',o:['3 Star','5 Star']},{k:'inv',l:'Compressor',o:['Inverter','Non-Inverter']}]},
'Air Cooler':{i:'💨',f:[{k:'type',l:'Type',o:['Personal','Tower','Desert']},{k:'cap',l:'Capacity',u:' L',o:['20','30','50','70','100']}]},
'Microwave':{i:'🍲',f:[{k:'type',l:'Type',o:['Solo','Grill','Convection']},{k:'cap',l:'Capacity',u:' L',o:['20','23','25','30']}]},
'Other':{i:'📦',f:[{k:'type',l:'Type / name',o:[]},{k:'spec',l:'Details (size, colour…)',o:[]}]}};
const BR=['Samsung','LG','Sony','Panasonic','Whirlpool','Haier','Godrej','Voltas','Hisense','TCL','Mi','IFB','Bosch','Daikin','Hitachi','Blue Star','Symphony','Bajaj','Kenstar','Onida'];
const fs=(c,a)=>CATS[c].f.filter(f=>!f.when||f.when(a||{}));
const brands=()=>[...new Set([...BR,...db.products.map(p=>p.brand)])].sort();
let me=null,S={tab:'cat',cat:'TV',brand:'',a:{},q:'',sure:''},F=blank(),U=ublank();
function blank(c){return{id:'',cat:c||'TV',brand:'',model:'',a:{},qty:'',mrp:'',dealer:''}}
function ublank(){return{old:'',name:'',pw:'',role:'sales',add:0,edit:0,del:0,sell:1,blocked:[]}}
try{const n=sessionStorage.getItem('shopme');if(n)me=mk(n)}catch(e){}
function mk(n){if(n=='parth')return{name:'parth',owner:1,add:1,edit:1,del:1,blocked:[]};const u=db.users.find(x=>x.name==n);return u?{...u,owner:0}:null}
const P=()=>db.products.filter(p=>me.owner||!(me.blocked||[]).includes(p.brand));
const num=v=>/^[\d.]+$/.test(v);const srt=a=>a.sort((x,y)=>num(x)&&num(y)?x-y:String(x).localeCompare(y));
const pills=p=>fs(p.cat,p.a).map(f=>p.a[f.k]?`<span class="pill">${esc(p.a[f.k]+(f.u||''))}</span>`:'').join('');
const specs=p=>fs(p.cat,p.a).map(f=>p.a[f.k]?p.a[f.k]+(f.u||''):'').filter(Boolean).join(' · ');
const rs=v=>v===''||v==null?'—':'₹'+Number(v).toLocaleString('en-IN');
function match(p,ex){if(p.cat!=S.cat)return false;if(ex!='brand'&&S.brand&&p.brand!=S.brand)return false;for(const k in S.a)if(k!=ex&&p.a[k]!=S.a[k])return false;return true}
function sm(p,q){q=q.toLowerCase().replace(/(\d)\s*(inch|in|")/g,'$1 ');const h=(p.cat+' '+p.brand+' '+p.model+' '+Object.values(p.a).join(' ')).toLowerCase(),w=h.split(/[^a-z0-9.]+/);return q.split(/\s+/).filter(t=>t&&!['inch','in','"'].includes(t)).every(t=>num(t)?w.includes(t):h.includes(t))}
function card(p,sc){return`<div class="card ${p.qty>0?'':'out'}"><div class="ic">${CATS[p.cat].i}</div><div class="b">${esc(sc?p.cat+' · ':'')}${esc(p.brand)}</div><div class="m">${esc(p.model)}</div><div>${pills(p)}</div>${outletLine(p)}<div class="r"><span class="pr">${rs(p.mrp)}</span><span class="st">${p.qty>0?p.qty+' in stock':'Out of stock'}</span></div>${me.owner&&p.dealer!==''?`<div class="d">Dealer: ${rs(p.dealer)}</div>`:''}</div>`}
function chips(lbl,opts,sel,act,k,u){return`<div><label>${lbl}</label>${opts.map(o=>`<span class="chip ${sel==o.v?'on':''} ${o.out?'off':''}" data-act="${act}" data-k="${k||''}" data-v="${esc(o.v)}">${esc(o.v+(u||''))}</span>`).join('')||'<span class="mut">none in stock list</span>'}</div>`}
function facets(){let h='';const bl=P().filter(p=>match(p,'brand')),bs=srt([...new Set(bl.map(p=>p.brand))]);
h+=chips('Brand',bs.map(v=>({v,out:!bl.some(p=>p.brand==v&&p.qty>0)})),S.brand,'brand');
for(const f of fs(S.cat,S.a)){const l=P().filter(p=>match(p,f.k)),os=srt([...new Set(l.map(p=>p.a[f.k]).filter(Boolean))]);h+=chips(f.l,os.map(v=>({v,out:!l.some(p=>p.a[f.k]==v&&p.qty>0)})),S.a[f.k],'attr',f.k,f.u)}return h}
function results(){const all=P();
if(S.q.trim()){const l=all.filter(p=>sm(p,S.q));if(!l.length)return'<p class="mut">No matching models.</p>';const g={};l.forEach(p=>(g[p.brand]=g[p.brand]||[]).push(p));
return Object.keys(g).sort().map(b=>{const a=g[b].sort((x,y)=>(y.qty>0)-(x.qty>0));return`<h2>${esc(b)} <span class="mut">· ${a.filter(p=>p.qty>0).length} available</span></h2><div class="grid">${a.map(p=>card(p,1)).join('')}</div>`}).join('')}
const l=all.filter(p=>match(p,null)).sort((x,y)=>(y.qty>0)-(x.qty>0)||x.brand.localeCompare(y.brand));
if(!all.length)return`<p class="mut">No stock yet. Add items in the Stock tab.</p>`;
return l.length?`<div class="grid">${l.map(p=>card(p)).join('')}</div>`:'<p class="mut">No models for this selection.</p>'}
function catView(){const n=c=>P().filter(p=>p.cat==c).length;return`<div class="box"><input id="q" class="srch" placeholder="🔍  Search: 32, 43 inch LED, Samsung, double door…" value="${esc(S.q)}"></div>
<div id="flt" style="${S.q?'display:none':''}"><div class="cats">${Object.keys(CATS).map(c=>`<div class="tile ${S.cat==c?'on':''}" data-act="cat" data-v="${c}"><div class="e">${CATS[c].i}</div>${c}<small>${n(c)} models</small></div>`).join('')}</div><div class="box"><div id="fc">${facets()}</div><button data-act="clear">Clear filters</button></div></div><div id="res">${results()}</div>`}
function fval(f,v){return`<div><label>${f.l}${f.u||''}</label><input list="dl_${f.k}" data-fa="${f.k}" value="${esc(v||'')}"><datalist id="dl_${f.k}">${f.o.map(o=>`<option value="${o}">`).join('')}</datalist></div>`}

function outletInputs(){return vis().map(o=>`<div><label>Qty · ${esc(o.name)}</label><input type="number" min="0" data-fs="${esc(o.id)}" value="${esc((F.stock||{})[o.id]??'')}"></div>`).join('')}
function stepper(p){return vis().map(o=>{const n=+(p.stock||{})[o.id]||0;return`<div class="os"><small>${esc(o.name)}</small>${me.edit||me.owner?`<button data-act="qty" data-id="${p.id}" data-o="${esc(o.id)}" data-d="-1">−</button> <b>${n}</b> <button data-act="qty" data-id="${p.id}" data-o="${esc(o.id)}" data-d="1">+</button>`:me.sell?`<button data-act="qty" data-id="${p.id}" data-o="${esc(o.id)}" data-d="-1">−</button> <b>${n}</b>`:`<b>${n}</b>`}</div>`}).join('')}
function outletsView(){return`<div class="box"><h2>Add outlet</h2><div class="f"><div><label>Outlet name</label><input id="onew" placeholder="e.g. Main Shop, Station Road"></div></div><p><button class="p" data-act="addO">Add outlet</button><span class="err" id="oerr"></span></p></div><div class="box"><h2>Your outlets</h2>${db.outlets.map(o=>`<div class="r" style="gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)"><input data-on="${esc(o.id)}" value="${esc(o.name)}" style="flex:1"><button data-act="renO" data-id="${esc(o.id)}">Rename</button><button class="dg" data-act="delO" data-id="${esc(o.id)}">${S.sure=='o:'+o.id?'Sure?':'Delete'}</button></div>`).join('')}<p class="mut">An outlet can only be deleted once its stock is zero. Add stock for each outlet when you add or edit a product.</p></div>`}
async function addOutlet(){const n=$('#onew').value.trim();if(!n){$('#oerr').textContent=' Enter a name';return}try{apply(await api('saveO',{name:n}));note('Outlet added ✓',1)}catch(e){$('#oerr').textContent=' '+e.message}render()}
async function renOutlet(id){const el=document.querySelector('[data-on="'+id+'"]');try{apply(await api('saveO',{id,name:el.value}));note('Renamed ✓',1)}catch(e){note(e.message)}render()}
async function delOutlet(id){if(S.sure!='o:'+id){S.sure='o:'+id;render();return}S.sure='';try{apply(await api('delO',{id}));note('Outlet deleted',1)}catch(e){note(e.message)}render()}
const ROLES={owner:{label:'Owner',add:1,edit:1,del:1,sell:1,d:'Full access like you: sees dealer prices and manages team, outlets and all stock. Only you can create or remove Owners.'},manager:{label:'Manager',add:1,edit:1,del:1,sell:1,d:'Can add, edit and delete products and change stock. Cannot see dealer prices or manage the team.'},store:{label:'Store Keeper',add:1,edit:1,del:0,sell:1,d:'Can add products and change stock. Cannot delete products or see dealer prices.'},sales:{label:'Sales Officer',add:0,edit:0,del:0,sell:1,d:'Can browse the catalogue and record sales by reducing stock. Cannot add, edit or delete products.'}};
const roleLabel=u=>(ROLES[u&&u.role]||{label:'Custom'}).label;
function roleBlock(){const opts=Object.keys(ROLES).filter(k=>k!='owner'||me.master).map(k=>`<option value="${k}" ${U.role==k?'selected':''}>${ROLES[k].label}</option>`).join('')+`<option value="custom" ${U.role=='custom'?'selected':''}>Custom…</option>`;
const r=ROLES[U.role];return`<h2>Role</h2><select data-role>${opts}</select><p class="mut" style="margin:6px 0 10px">${r?esc(r.d):'Choose exactly what this person can do.'}</p>${U.role=='custom'?`<div class="pm"><label><input type="checkbox" data-uc="add" ${U.add?'checked':''}> Add items</label><label><input type="checkbox" data-uc="edit" ${U.edit?'checked':''}> Edit stock / items</label><label><input type="checkbox" data-uc="del" ${U.del?'checked':''}> Delete items</label><label><input type="checkbox" data-uc="sell" ${U.sell?'checked':''}> Reduce stock (sales)</label></div>`:''}`}
var AX;
async function getLog(){return (await api('log')).log}
render();
</script>
